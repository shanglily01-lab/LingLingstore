<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.05);
        }
        .glass-header {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error-container": "#ffdad6",
                      "surface": "#f8f9ff",
                      "secondary-container": "#645efb",
                      "surface-container-low": "#eff4ff",
                      "secondary": "#4b41e1",
                      "on-error": "#ffffff",
                      "tertiary-container": "#191c1e",
                      "on-tertiary-fixed-variant": "#444749",
                      "background": "#f8f9ff",
                      "outline": "#76777d",
                      "on-secondary-fixed": "#0f0069",
                      "secondary-fixed-dim": "#c3c0ff",
                      "on-tertiary-fixed": "#191c1e",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#d3e4fe",
                      "outline-variant": "#c6c6cd",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-container-high": "#dce9ff",
                      "primary-fixed-dim": "#bec6e0",
                      "surface-container-highest": "#d3e4fe",
                      "primary-fixed": "#dae2fd",
                      "tertiary-fixed": "#e0e3e5",
                      "on-primary": "#ffffff",
                      "primary": "#000000",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-background": "#0b1c30",
                      "on-tertiary-container": "#818486",
                      "surface-bright": "#f8f9ff",
                      "on-surface": "#0b1c30",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#e2dfff",
                      "on-primary-fixed": "#131b2e",
                      "inverse-surface": "#213145",
                      "on-surface-variant": "#45464d",
                      "on-secondary-fixed-variant": "#3323cc",
                      "on-secondary-container": "#fffbff",
                      "primary-container": "#131b2e",
                      "surface-tint": "#565e74",
                      "surface-dim": "#cbdbf5",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary": "#ffffff",
                      "tertiary": "#000000",
                      "inverse-primary": "#bec6e0",
                      "error": "#ba1a1a",
                      "surface-container": "#e5eeff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "section-gap": "80px",
                      "margin-desktop": "40px",
                      "container-max": "1280px",
                      "margin-mobile": "16px",
                      "gutter": "24px",
                      "base": "8px"
              },
              "fontFamily": {
                      "price-display": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "display-lg": ["Inter"]
              },
              "fontSize": {
                      "price-display": ["20px", {"lineHeight": "1", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<!-- TopNavBar (Shell Mapping) -->
<!-- The "Destination" Rule: Suppressed on login page as per Shell Visibility & Relevance mandate -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-surface-container/80 backdrop-blur-xl border-b border-outline-variant/10 h-20 flex items-center">
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop w-full flex justify-center items-center">
<span class="font-headline-md text-headline-md font-bold tracking-tight text-primary">Web3Mall</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-20">
<div class="w-full max-w-[440px] bg-surface-container-lowest p-8 md:p-12 border border-outline-variant/20 editorial-shadow rounded-lg">
<!-- Login Content -->
<div class="flex flex-col gap-8">
<div class="space-y-2">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight">登录</h1>
<p class="font-body-md text-body-md text-on-surface-variant">欢迎回到 Web3Mall。探索全球精选商品。</p>
</div>
<form class="space-y-6" onsubmit="return false;">
<!-- Phone Input Group -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface font-semibold" for="phone">手机号码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant/50">
<span class="material-symbols-outlined text-[20px]" data-icon="smartphone">smartphone</span>
</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border border-outline-variant/30 rounded-lg focus:ring-0 focus:border-secondary transition-all font-body-md text-body-md placeholder:text-on-surface-variant/40" id="phone" placeholder="输入您的手机号" type="tel"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface font-semibold" for="password">密码</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline" href="#">忘记密码？</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant/50">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border border-outline-variant/30 rounded-lg focus:ring-0 focus:border-secondary transition-all font-body-md text-body-md placeholder:text-on-surface-variant/40" id="password" placeholder="输入您的密码" type="password"/>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-[#4f46e5] hover:bg-secondary text-white font-label-sm text-label-sm rounded-lg transition-all duration-300 transform active:scale-[0.98] editorial-shadow mt-4">
                        登录
                    </button>
</form>
<!-- Footer/Switch Action -->
<div class="flex flex-col items-center gap-6">
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline-variant/20 flex-grow"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant/50">或者</span>
<div class="h-px bg-outline-variant/20 flex-grow"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                        还没有账号？ 
                        <a class="text-secondary font-bold hover:underline" href="#">立即注册</a>
</p>
</div>
</div>
</div>
</main>
<!-- Visual Background Element (Atmospheric) -->
<div class="fixed top-0 right-0 -z-10 w-1/2 h-full opacity-20 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 right-[-10%] w-[800px] h-[800px] rounded-full bg-gradient-to-br from-secondary-container/20 to-transparent blur-[120px]"></div>
</div>
<!-- Footer (Shell Mapping) -->
<footer class="w-full py-12 bg-surface dark:bg-surface-container-lowest border-t border-outline-variant/20">
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-base">
<div class="flex flex-col items-center md:items-start gap-2">
<span class="font-headline-md text-headline-md font-bold text-primary">Web3Mall</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 Web3Mall. 全球直采，品质保证。</p>
</div>
<div class="flex gap-6 mt-6 md:mt-0">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">关于我们</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">帮助中心</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">服务协议</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">隐私政策</a>
</div>
</div>
</footer>
<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#4f46e5';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '';
            });
        });

        // Atmospheric parallax effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.fixed.top-0.right-0').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
