<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-header {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.8);
        }
        .auth-card {
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.05);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed": "#191c1e",
                      "error": "#ba1a1a",
                      "on-background": "#0b1c30",
                      "surface-variant": "#d3e4fe",
                      "outline": "#76777d",
                      "surface-container-high": "#dce9ff",
                      "primary": "#000000",
                      "surface": "#f8f9ff",
                      "primary-container": "#131b2e",
                      "on-tertiary": "#ffffff",
                      "background": "#f8f9ff",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-fixed": "#131b2e",
                      "primary-fixed-dim": "#bec6e0",
                      "on-secondary-fixed": "#0f0069",
                      "error-container": "#ffdad6",
                      "surface-dim": "#cbdbf5",
                      "on-tertiary-container": "#818486",
                      "inverse-primary": "#bec6e0",
                      "on-primary-fixed-variant": "#3f465c",
                      "outline-variant": "#c6c6cd",
                      "tertiary": "#000000",
                      "on-primary-container": "#7c839b",
                      "surface-tint": "#565e74",
                      "surface-container-highest": "#d3e4fe",
                      "secondary-container": "#645efb",
                      "on-surface-variant": "#45464d",
                      "tertiary-fixed": "#e0e3e5",
                      "on-secondary-container": "#fffbff",
                      "surface-bright": "#f8f9ff",
                      "primary-fixed": "#dae2fd",
                      "on-primary": "#ffffff",
                      "surface-container-low": "#eff4ff",
                      "secondary": "#4b41e1",
                      "inverse-on-surface": "#eaf1ff",
                      "on-tertiary-fixed-variant": "#444749",
                      "on-error": "#ffffff",
                      "inverse-surface": "#213145",
                      "secondary-fixed-dim": "#c3c0ff",
                      "on-surface": "#0b1c30",
                      "on-secondary": "#ffffff",
                      "tertiary-container": "#191c1e",
                      "on-secondary-fixed-variant": "#3323cc",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#e2dfff",
                      "surface-container": "#e5eeff",
                      "tertiary-fixed-dim": "#c4c7c9"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "section-gap": "80px",
                      "gutter": "24px",
                      "margin-desktop": "40px",
                      "margin-mobile": "16px",
                      "container-max": "1280px",
                      "base": "8px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "body-lg": ["Inter"],
                      "price-display": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "label-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "price-display": ["20px", {"lineHeight": "1", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-outline-variant/10">
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex justify-between items-center h-20">
<div class="font-headline-md text-headline-md font-bold tracking-tight text-primary">Web3Mall</div>
<div class="hidden md:flex items-center gap-gutter">
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="#">商品</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="#">购物车</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="#">订单</a>
<a class="text-primary font-bold border-b-2 border-primary pb-1 font-body-md text-body-md" href="#">登录</a>
</div>
<div class="flex items-center gap-base">
<button class="p-2 hover:bg-surface-container-low/50 transition-all rounded-full">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
</button>
<button class="p-2 hover:bg-surface-container-low/50 transition-all rounded-full">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</div>
</nav>
<!-- Main Registration Section -->
<main class="flex-grow flex items-center justify-center pt-32 pb-20 px-margin-mobile">
<div class="w-full max-w-[480px] bg-white border border-outline-variant/20 rounded-lg p-10 auth-card">
<!-- Title & Description -->
<div class="mb-10 text-center">
<h1 class="font-display-lg text-[32px] md:text-display-lg text-primary mb-3">注册</h1>
<p class="font-body-md text-body-md text-on-surface-variant">加入 Web3Mall，探索全球精选商品。</p>
</div>
<!-- Region Toggle -->
<div class="flex p-1 bg-surface-container-low rounded-lg mb-8">
<button class="flex-1 py-2 font-label-sm text-label-sm rounded-md transition-all duration-200 bg-white text-primary shadow-sm" id="region-mainland" onclick="toggleRegion('mainland')">
                    中国大陆
                </button>
<button class="flex-1 py-2 font-label-sm text-label-sm rounded-md transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="region-overseas" onclick="toggleRegion('overseas')">
                    海外
                </button>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Phone or Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="contact">手机号码或邮箱</label>
<input class="w-full h-12 px-4 rounded-[4px] border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all font-body-md text-body-md bg-transparent" id="contact" placeholder="请输入手机号或电子邮箱" type="text"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">密码</label>
<input class="w-full h-12 px-4 rounded-[4px] border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all font-body-md text-body-md bg-transparent" id="password" placeholder="设置您的登录密码" type="password"/>
</div>
<!-- OTP (Verification Code) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="otp">验证码</label>
<div class="flex gap-3">
<input class="flex-grow h-12 px-4 rounded-[4px] border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all font-body-md text-body-md bg-transparent" id="otp" placeholder="输入验证码" type="text"/>
<button class="px-6 h-12 font-label-sm text-label-sm border border-primary text-primary hover:bg-surface-container-low transition-colors rounded-[4px] whitespace-nowrap" type="button">
                            发送验证码
                        </button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 mt-4 bg-primary-container text-white font-label-sm text-[16px] font-bold rounded-[4px] hover:opacity-90 active:opacity-70 transition-all flex items-center justify-center gap-2" type="submit">
<span>注册</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="#">
                    已有账号？<span class="text-secondary font-bold">立即登录</span>
</a>
</div>
</div>
</main>
<!-- Side Decoration (Asymmetric Editorial Element) -->
<div class="fixed right-0 top-0 h-full w-1/4 pointer-events-none hidden lg:block overflow-hidden">
<div class="absolute inset-0 flex items-center justify-center opacity-10">
<span class="material-symbols-outlined text-[400px] text-primary select-none" data-icon="shopping_bag">shopping_bag</span>
</div>
</div>
<!-- Footer -->
<footer class="w-full py-12 bg-surface border-t border-outline-variant/20">
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-base">
<div class="font-headline-md text-headline-md font-bold text-primary mb-4 md:mb-0">Web3Mall</div>
<div class="flex gap-gutter mb-6 md:mb-0">
<a class="text-on-surface-variant hover:text-secondary transition-colors font-label-sm text-label-sm" href="#">关于我们</a>
<a class="text-on-surface-variant hover:text-secondary transition-colors font-label-sm text-label-sm" href="#">帮助中心</a>
<a class="text-on-surface-variant hover:text-secondary transition-colors font-label-sm text-label-sm" href="#">服务协议</a>
<a class="text-on-surface-variant hover:text-secondary transition-colors font-label-sm text-label-sm" href="#">隐私政策</a>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 Web3Mall. 全球直采，品质保证。</p>
</div>
</footer>
<script>
        function toggleRegion(region) {
            const mainlandBtn = document.getElementById('region-mainland');
            const overseasBtn = document.getElementById('region-overseas');
            
            if (region === 'mainland') {
                mainlandBtn.classList.add('bg-white', 'text-primary', 'shadow-sm');
                mainlandBtn.classList.remove('text-on-surface-variant');
                overseasBtn.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                overseasBtn.classList.add('text-on-surface-variant');
            } else {
                overseasBtn.classList.add('bg-white', 'text-primary', 'shadow-sm');
                overseasBtn.classList.remove('text-on-surface-variant');
                mainlandBtn.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                mainlandBtn.classList.add('text-on-surface-variant');
            }
        }

        // Add focus effects for a more premium feel
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-secondary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-secondary');
            });
        });
    </script>
</body></html>
